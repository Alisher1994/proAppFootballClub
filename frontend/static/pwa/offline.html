<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Нет подключения — FK Karasu</title>
    <link rel="icon" type="image/png" href="/static/pwa/icon-192.png">
    <style>
        :root { color-scheme: light; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f4f1ee 0%, #e8e1da 100%);
            color: #17191f;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
            background: #fff;
            border: 1px solid #e4ddd6;
            border-radius: 18px;
            box-shadow: 0 10px 36px rgba(23, 25, 31, .08);
        }

        img { width: 84px; height: 84px; }

        h1 { margin: 16px 0 8px; font-size: 20px; }

        p { margin: 0 0 20px; color: #5f6673; font-size: 14px; line-height: 1.5; }

        button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff8a00 0%, #d96f00 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="/static/pwa/icon-192.png" alt="FK Karasu">
        <h1>Нет подключения</h1>
        <p>Приложение FK Karasu не может связаться с сервером. Проверьте интернет и попробуйте снова.</p>
        <button type="button" onclick="location.reload()">Повторить</button>
    </div>
</body>

</html>
