<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Турниры — {{ system_name }}</title>
    <meta name="description" content="Афиша футбольных турниров {{ system_name }}: предстоящие соревнования и архив прошедших.">
    <meta name="theme-color" content="#ff8a00">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='pwa/icon-192.png') }}">
    {% include '_pwa_head.html' %}
    <link href="{{ url_for('static', filename='vendor/onest/onest.css') }}" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --line: #e4ddd6;
            --muted: #6b7280;
            --accent: #ff8a00;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100dvh;
            padding-bottom: calc(32px + env(safe-area-inset-bottom));
            background: linear-gradient(135deg, #f4f1ee 0%, #e8e1da 100%);
            color: #17191f;
            font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .wrap {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 14px;
        }

        .topbar {
            margin-bottom: 20px;
            padding: calc(16px + env(safe-area-inset-top)) 0 16px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            text-decoration: none;
            color: inherit;
        }

        .brand img { height: 40px; width: auto; }

        .login-link {
            flex: 0 0 auto;
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: #f8f7f6;
            color: #444a54;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            white-space: nowrap;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 26px;
            line-height: 1.2;
        }

        .lead {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 14.5px;
        }

        .tabs {
            display: inline-flex;
            gap: 4px;
            margin-bottom: 18px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }

        .tabs button {
            min-height: 38px;
            padding: 0 16px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #5f6673;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        .tabs button.active {
            background: #fff5eb;
            color: #b45f09;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .card {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            overflow: hidden;
        }

        .card-photo {
            position: relative;
            height: 150px;
            background: #efe9e3 center/cover no-repeat;
        }

        .card-photo.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b9b2ab;
        }

        .card-photo.empty svg { width: 42px; height: 42px; }

        .card-date {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(23, 25, 31, .78);
            color: #fff;
            font-size: 12.5px;
            font-weight: 650;
        }

        .card-body {
            display: grid;
            gap: 10px;
            padding: 15px 16px 17px;
        }

        .card h2 {
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .meta {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13.5px;
        }

        .meta div {
            display: flex;
            align-items: flex-start;
            gap: 7px;
        }

        .meta svg {
            flex: 0 0 auto;
            width: 15px;
            height: 15px;
            margin-top: 2px;
        }

        .ages {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .age {
            padding: 3px 10px;
            border: 1px solid #ffd9b0;
            border-radius: 999px;
            background: #fff5eb;
            color: #b45f09;
            font-size: 12.5px;
            font-weight: 650;
        }

        .map-link {
            color: var(--accent);
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
        }

        .credit {
            color: #a8a29b;
            font-size: 11px;
        }

        .empty-state {
            padding: 40px 16px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            background: #fff;
            color: var(--muted);
            text-align: center;
        }

        .card.finished .card-photo { filter: grayscale(.55); }

        @media (max-width: 520px) {
            h1 { font-size: 22px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="wrap">
            <a class="brand" href="{{ url_for('public_tournaments_page') }}">
                <img src="{{ system_logo_url }}" alt="{{ system_name }}">
            </a>
            <a class="login-link" href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>

    <div class="wrap">
        <h1>Турниры</h1>
        <p class="lead">Расписание соревнований и архив прошедших турниров.</p>

        <div class="tabs" role="tablist">
            <button type="button" class="active" data-tab="upcoming">Предстоящие</button>
            <button type="button" data-tab="past">Завершённые</button>
        </div>

        <div class="grid" id="tournamentGrid">
            <div class="empty-state">Загрузка…</div>
        </div>
    </div>

    <script>
        const state = { tab: 'upcoming', data: { upcoming: [], past: [] } };
        const byId = (id) => document.getElementById(id);

        function escapeHtml(value) {
            // innerHTML не экранирует кавычки, а значение попадает и в атрибуты.
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            if (!value) return '';
            return new Intl.DateTimeFormat('ru-RU', {
                day: '2-digit', month: 'long', year: 'numeric',
            }).format(new Date(`${value}T00:00:00`));
        }

        function formatRange(start, end) {
            if (!start) return '';
            if (!end || end === start) return formatDate(start);
            const from = new Date(`${start}T00:00:00`);
            const to = new Date(`${end}T00:00:00`);
            // В пределах одного месяца день начала показываем без месяца: «1–3 сентября 2026».
            if (from.getMonth() === to.getMonth() && from.getFullYear() === to.getFullYear()) {
                return `${from.getDate()}–${formatDate(end)}`;
            }
            return `${formatDate(start)} — ${formatDate(end)}`;
        }

        function shortDate(value) {
            if (!value) return '';
            return new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: 'short' })
                .format(new Date(`${value}T00:00:00`));
        }

        const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
        const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
        const ICON_BALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/></svg>';

        function cardMarkup(item, finished) {
            const image = item.poster_url || (item.stadium && item.stadium.photo_url) || '';
            const photo = image
                ? `<div class="card-photo" style="background-image:url('${escapeHtml(image)}')">`
                : `<div class="card-photo empty">${ICON_BALL}`;
            const mapLink = item.stadium && item.stadium.latitude
                ? `<a class="map-link" target="_blank" rel="noopener"
                     href="https://www.openstreetmap.org/?mlat=${item.stadium.latitude}&mlon=${item.stadium.longitude}#map=17/${item.stadium.latitude}/${item.stadium.longitude}">Открыть на карте</a>`
                : '';
            const credit = !item.poster_url && item.stadium && item.stadium.photo_source
                ? `<div class="credit">Фото: ${escapeHtml(item.stadium.photo_source)}</div>` : '';
            return `
                <article class="card${finished ? ' finished' : ''}">
                    ${photo}
                        <span class="card-date">${escapeHtml(shortDate(item.start_date))}</span>
                    </div>
                    <div class="card-body">
                        <h2>${escapeHtml(item.name)}</h2>
                        <div class="meta">
                            <div>${ICON_CLOCK}<span>${escapeHtml(formatRange(item.start_date, item.end_date))}${item.start_time ? `, ${escapeHtml(item.start_time)}` : ''}</span></div>
                            <div>${ICON_PIN}<span>${escapeHtml(item.location || 'Место уточняется')}</span></div>
                        </div>
                        ${item.age_groups.length
                            ? `<div class="ages">${item.age_groups.map((age) => `<span class="age">${escapeHtml(age)}</span>`).join('')}</div>`
                            : ''}
                        ${mapLink}
                        ${credit}
                    </div>
                </article>`;
        }

        function render() {
            const items = state.data[state.tab] || [];
            const grid = byId('tournamentGrid');
            if (!items.length) {
                grid.innerHTML = `<div class="empty-state">${state.tab === 'upcoming'
                    ? 'Предстоящих турниров пока нет. Загляните позже.'
                    : 'Завершённых турниров пока нет.'}</div>`;
                return;
            }
            grid.innerHTML = items.map((item) => cardMarkup(item, state.tab === 'past')).join('');
        }

        document.querySelectorAll('.tabs button').forEach((button) => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tabs button').forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
                state.tab = button.dataset.tab;
                render();
            });
        });

        fetch('/api/public/tournaments', { credentials: 'same-origin' })
            .then((response) => response.json())
            .then((data) => {
                state.data = { upcoming: data.upcoming || [], past: data.past || [] };
                render();
            })
            .catch(() => {
                byId('tournamentGrid').innerHTML =
                    '<div class="empty-state">Не удалось загрузить афишу. Обновите страницу.</div>';
            });
    </script>
</body>

</html>
