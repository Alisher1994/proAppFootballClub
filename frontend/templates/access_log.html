<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал проходов</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% include '_sidebar.html' %}

    <main class="main-content access-log-page">
        <section class="access-log-shell">
            <header class="access-log-header">
                <div>
                    <h1>Журнал проходов</h1>
                    <p>Вход и выход через Face ID терминалы. Событие входа автоматически создаёт отметку посещения.</p>
                </div>
                <button class="access-refresh-btn" id="refreshAccessLogBtn" type="button" title="Обновить">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M3 21v-5h5" />
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M16 8h5V3" />
                    </svg>
                    Обновить
                </button>
            </header>

            <div class="access-filters">
                <input id="accessDateFilter" type="date">
                <select id="accessDirectionFilter">
                    <option value="">Все направления</option>
                    <option value="entry">Вход</option>
                    <option value="exit">Выход</option>
                </select>
                <select id="accessResultFilter">
                    <option value="">Все статусы</option>
                    <option value="granted">Пропущен</option>
                    <option value="denied">Отклонён</option>
                    <option value="error">Ошибка</option>
                </select>
                <input id="accessSearchFilter" type="search" placeholder="Поиск: ФИО, ID, группа">
            </div>

            <div class="access-table-card">
                <table class="access-table">
                    <thead>
                        <tr>
                            <th>Время</th>
                            <th>Направление</th>
                            <th>ID</th>
                            <th>Ученик / сотрудник</th>
                            <th>Группа</th>
                            <th>Терминал</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="accessLogBody">
                        <tr>
                            <td colspan="7" class="access-empty">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/access_log.js') }}"></script>
</body>

</html>
