<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал проходов</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2026070305">
</head>

<body>
    {% include '_sidebar.html' %}

    <main class="main-content access-log-page">
        <section class="access-log-shell">
            <header class="access-log-header">
                <div>
                    <h1>Журнал проходов</h1>
                    <p>Вход и выход через Face ID терминалы. События учеников автоматически создают отметку посещения.</p>
                </div>
                <button class="access-refresh-btn" id="refreshAccessLogBtn" type="button" title="Обновить">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                        <path d="M3 21v-5h5" />
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                        <path d="M16 8h5V3" />
                    </svg>
                    Обновить
                </button>
            </header>

            <div class="access-filters">
                <input id="accessStartDateFilter" type="date" aria-label="Дата начала">
                <input id="accessEndDateFilter" type="date" aria-label="Дата конца">
                <select id="accessDirectionFilter">
                    <option value="">Все направления</option>
                    <option value="entry">Вход</option>
                    <option value="exit">Выход</option>
                </select>
                <select id="accessResultFilter">
                    <option value="">Все статусы</option>
                    <option value="granted">Проход разрешён</option>
                    <option value="denied">Отклонён</option>
                    <option value="error">Ошибка</option>
                </select>
                <input id="accessSearchFilter" type="search" placeholder="Поиск: ФИО, ID, группа">
            </div>

            <div class="access-table-card">
                <table class="access-table">
                    <thead>
                        <tr>
                            <th>Время</th>
                            <th>Фото</th>
                            <th>Направление</th>
                            <th>ID</th>
                            <th>Ученик / сотрудник</th>
                            <th>Группа</th>
                            <th>Терминал</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="accessLogBody">
                        <tr>
                            <td colspan="8" class="access-empty">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="access-pagination" id="accessPagination">
                <span id="accessPageInfo">0 записей</span>
                <div class="access-pagination-actions">
                    <button class="access-page-btn" id="accessPrevPage" type="button" aria-label="Предыдущая страница">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </button>
                    <span id="accessPageNumber">1 / 1</span>
                    <button class="access-page-btn" id="accessNextPage" type="button" aria-label="Следующая страница">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div class="access-photo-modal" id="accessPhotoModal" hidden>
        <div class="access-photo-dialog" role="dialog" aria-modal="true" aria-labelledby="accessPhotoTitle">
            <button class="access-photo-close" id="accessPhotoClose" type="button" aria-label="Закрыть">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6 6 18" />
                    <path d="m6 6 12 12" />
                </svg>
            </button>
            <div class="access-photo-stage access-photo-compare">
                <figure class="access-photo-panel">
                    <figcaption>Фото терминала</figcaption>
                    <img id="accessPhotoImage" alt="">
                </figure>
                <figure class="access-photo-panel">
                    <figcaption>Фото в системе</figcaption>
                    <img id="accessSystemPhotoImage" alt="" hidden>
                    <div class="access-system-photo-empty" id="accessSystemPhotoEmpty" hidden>Нет фото</div>
                </figure>
            </div>
            <div class="access-photo-caption">
                <strong id="accessPhotoTitle">Фото прохода</strong>
                <span id="accessPhotoMeta"></span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/access_log.js') }}?v=2026070305"></script>
</body>

</html>
