<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата - {{ system_name }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            margin: 0;
            background: #f7f4f1;
            color: #0f172a;
            font-family: var(--ui-font-family);
        }
        .pay-shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 18px 44px;
        }
        .pay-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            margin-bottom: 14px;
        }
        .pay-grid {
            display: block;
        }
        .pay-panel {
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            padding: 20px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .045);
        }
        .pay-logo-center {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }
        .pay-logo-center img {
            width: 138px;
            max-height: 81px;
            object-fit: contain;
        }
        .pay-form {
            display: grid;
            gap: 13px;
        }
        .pay-form label {
            display: grid;
            gap: 7px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }
        .pay-form input[type="text"] {
            min-height: 42px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            padding: 0 12px;
            background: #fff;
            color: #0f172a;
            font-size: 14px;
        }
        .pay-combobox {
            position: relative;
        }
        .pay-combobox input {
            width: 100%;
        }
        .pay-combobox::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #64748b;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .pay-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 5px);
            z-index: 20;
            display: none;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 16px 34px rgba(15, 23, 42, .12);
            padding: 5px;
        }
        .pay-dropdown.open {
            display: grid;
            gap: 2px;
        }
        .pay-option {
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #1f2937;
            padding: 9px 10px;
            text-align: left;
            font: 500 13px/1.25 var(--ui-font-family);
            cursor: pointer;
        }
        .pay-option:hover,
        .pay-option:focus-visible {
            background: #f7f4f1;
            outline: none;
        }
        .pay-empty {
            padding: 10px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }
        .pay-summary {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 4px;
            padding: 14px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #f8f7f6;
        }
        .pay-summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #475569;
            font-size: 13px;
        }
        .pay-summary-row strong {
            color: #0f172a;
            text-align: right;
            font-size: 14px;
        }
        .pay-methods {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .pay-method {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 44px;
            padding: 0 12px;
            border: 1px solid #d8d0c8;
            border-radius: 8px;
            background: #fff;
            color: #334155;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }
        .pay-form .pay-method {
            display: flex;
            grid-template-columns: none;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
        }
        .pay-method input { display: none; }
        .pay-method-logo {
            width: 38px;
            height: 24px;
            object-fit: contain;
            flex: 0 0 auto;
            filter: grayscale(1);
            opacity: .72;
            transition: filter .18s ease, opacity .18s ease;
        }
        .pay-method-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pay-method:has(input:checked) {
            border-color: #ff8a00;
            background: #fff6eb;
            color: #d96f00;
        }
        .pay-method:has(input:checked) .pay-method-logo {
            filter: grayscale(0);
            opacity: 1;
        }
        .pay-method.disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .pay-consent {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #475569;
            font-size: 13px;
            line-height: 1.45;
        }
        .pay-form .pay-consent {
            display: flex;
            grid-template-columns: none;
            flex-direction: row;
        }
        .pay-consent input {
            margin: 0;
            flex: 0 0 auto;
        }
        .pay-consent input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1.5px solid #111827;
            border-radius: 3px;
            background: #fff;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
        }
        .pay-consent input[type="checkbox"]::before {
            content: "";
            width: 8px;
            height: 8px;
            transform: scale(0);
            background: #fff;
            clip-path: polygon(14% 44%, 0 58%, 38% 96%, 100% 20%, 86% 6%, 36% 68%);
        }
        .pay-consent input[type="checkbox"]:checked {
            border-color: #ff8a00;
            background: #ff8a00;
        }
        .pay-consent input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
        #pay-submit {
            min-height: 42px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
        }
        #pay-submit:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .pay-consent a {
            color: #d96f00;
            font-weight: 700;
            text-decoration: none;
        }
        .pay-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            padding-top: 10px;
            border-top: 1px solid #e4ddd6;
            font-size: 12px;
            font-family: var(--ui-font-family);
        }
        .pay-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-weight: 600;
            text-decoration: none;
        }
        .pay-links a:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .pay-link-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #eef1f5;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }
        .pay-note {
            margin-top: 12px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
        }
        .pay-result {
            min-height: 20px;
            margin-top: 12px;
            color: #059669;
            font-size: 14px;
            font-weight: 700;
        }
        .pay-result.error { color: #dc2626; }
        .pay-provider-box {
            display: none;
            margin-top: 12px;
            padding: 14px;
            border: 1px solid #e4ddd6;
            border-radius: 8px;
            background: #fff;
        }
        .pay-provider-box img {
            display: block;
            max-width: 180px;
            max-height: 180px;
            margin-top: 10px;
            border-radius: 8px;
        }
        .pay-step-hidden {
            display: none !important;
        }
        @media (max-width: 860px) {
            .pay-methods { grid-template-columns: 1fr; }
            .pay-header { justify-content: stretch; }
            .pay-header .btn-secondary { width: 100%; justify-content: center; }
        }
    </style>
</head>

<body>
    <main class="pay-shell">
        <header class="pay-header">
            <a class="btn-secondary" href="{{ url_for('login') }}">Войти в систему</a>
        </header>

        <div class="pay-grid">
            <section class="pay-panel">
                <div class="pay-logo-center">
                    <img src="{{ system_logo_url }}" alt="{{ system_name }}">
                </div>
                <form class="pay-form" id="pay-form">
                    <label id="pay-group-step">
                        Группа
                        <div class="pay-combobox">
                            <input id="pay-group" type="text" autocomplete="off" placeholder="Введите название группы">
                            <div class="pay-dropdown" id="pay-group-list"></div>
                        </div>
                    </label>
                    <label id="pay-student-step" class="pay-step-hidden">
                        Ученик
                        <div class="pay-combobox">
                            <input id="pay-student" type="text" autocomplete="off" placeholder="Сначала выберите группу" disabled>
                            <div class="pay-dropdown" id="pay-student-list"></div>
                        </div>
                    </label>

                    <div class="pay-summary" id="pay-summary" style="display:none;"></div>

                    <label id="pay-method-step" class="pay-step-hidden">
                        Способ оплаты
                        <div class="pay-methods" id="pay-methods"></div>
                    </label>

                    <label class="pay-consent pay-step-hidden" id="pay-consent-step">
                        <input type="checkbox" id="pay-consent" required>
                        <span>
                            Я принимаю <a href="{{ url_for('legal_page', section='offer', lang='ru') }}" target="_blank">пользовательское соглашение</a>,
                            <a href="{{ url_for('legal_page', section='privacy', lang='ru') }}" target="_blank">политику конфиденциальности</a>
                            и <a href="{{ url_for('legal_page', section='refund', lang='ru') }}" target="_blank">правила оплаты и возврата</a>.
                        </span>
                    </label>

                    <button class="btn-primary pay-step-hidden" id="pay-submit" type="submit" disabled>Перейти к оформлению</button>
                    <div class="pay-result" id="pay-result"></div>
                    <div class="pay-provider-box" id="pay-provider-box"></div>

                    <div class="pay-links">
                        <a href="{{ url_for('legal_page', section='privacy', lang='ru') }}" target="_blank"><span class="pay-link-icon">i</span>Политика конфиденциальности</a>
                        <a href="{{ url_for('legal_page', section='offer', lang='ru') }}" target="_blank"><span class="pay-link-icon">✓</span>Пользовательское соглашение</a>
                        <a href="{{ url_for('legal_page', section='refund', lang='ru') }}" target="_blank"><span class="pay-link-icon">₽</span>Правила оплаты и возврата</a>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script>
        const state = { groups: [], methods: [], students: [], selectedGroup: null, selectedStudent: null };
        const groupInput = document.getElementById('pay-group');
        const groupList = document.getElementById('pay-group-list');
        const studentInput = document.getElementById('pay-student');
        const studentList = document.getElementById('pay-student-list');
        const methodsBox = document.getElementById('pay-methods');
        const summaryBox = document.getElementById('pay-summary');
        const submitBtn = document.getElementById('pay-submit');
        const resultBox = document.getElementById('pay-result');
        const providerBox = document.getElementById('pay-provider-box');
        const studentStep = document.getElementById('pay-student-step');
        const methodStep = document.getElementById('pay-method-step');
        const consentStep = document.getElementById('pay-consent-step');
        const consentInput = document.getElementById('pay-consent');

        const money = value => `${Number(value || 0).toLocaleString('ru-RU')} сум`;
        const escapeHtml = value => String(value || '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));

        function syncSubmit() {
            const method = document.querySelector('input[name="pay_method"]:checked');
            const hasGroup = Boolean(state.selectedGroup);
            const hasStudent = Boolean(state.selectedStudent);
            const hasMethod = Boolean(method);
            const hasConsent = Boolean(consentInput.checked);

            studentStep.classList.toggle('pay-step-hidden', !hasGroup);
            methodStep.classList.toggle('pay-step-hidden', !hasStudent);
            consentStep.classList.toggle('pay-step-hidden', !hasMethod);
            submitBtn.classList.toggle('pay-step-hidden', !hasMethod);
            submitBtn.disabled = !(hasGroup && hasStudent && hasMethod && hasConsent);
        }

        function findByName(items, value, field = 'name') {
            const normalized = (value || '').trim().toLowerCase();
            return items.find(item => String(item[field] || '').trim().toLowerCase() === normalized) || null;
        }

        function renderDropdown(box, items, field, onSelect) {
            const visible = items.slice(0, 40);
            if (!visible.length) {
                box.innerHTML = '<div class="pay-empty">Ничего не найдено</div>';
                box.classList.add('open');
                return;
            }
            box.innerHTML = visible.map(item => (
                `<button class="pay-option" type="button" data-id="${item.id}">${escapeHtml(item[field])}</button>`
            )).join('');
            box.classList.add('open');
            box.querySelectorAll('.pay-option').forEach(button => {
                button.addEventListener('click', () => {
                    const item = visible.find(entry => String(entry.id) === button.dataset.id);
                    if (item) onSelect(item);
                    box.classList.remove('open');
                });
            });
        }

        function showGroupOptions() {
            const query = groupInput.value.trim().toLowerCase();
            const items = state.groups.filter(group => String(group.name || '').toLowerCase().includes(query));
            renderDropdown(groupList, items, 'name', selectGroup);
        }

        function showStudentOptions() {
            if (studentInput.disabled) return;
            const query = studentInput.value.trim().toLowerCase();
            const items = state.students.filter(student => String(student.full_name || '').toLowerCase().includes(query));
            renderDropdown(studentList, items, 'full_name', selectStudent);
        }

        function resetPaymentProgress() {
            consentInput.checked = false;
            document.querySelectorAll('input[name="pay_method"]').forEach(input => { input.checked = false; });
            providerBox.style.display = 'none';
            providerBox.innerHTML = '';
            resultBox.textContent = '';
            resultBox.classList.remove('error');
        }

        function selectGroup(group) {
            state.selectedGroup = group;
            state.selectedStudent = null;
            groupInput.value = group.name;
            studentInput.value = '';
            resetPaymentProgress();
            renderSummary();
            syncSubmit();
            loadStudents(group.id);
        }

        function selectStudent(student) {
            state.selectedStudent = student;
            studentInput.value = student.full_name;
            resetPaymentProgress();
            renderSummary();
            syncSubmit();
        }

        function renderMethods() {
            methodsBox.innerHTML = state.methods.map(method => `
                <label class="pay-method ${method.enabled ? '' : 'disabled'}">
                    <input type="radio" name="pay_method" value="${method.key}" ${method.enabled ? '' : 'disabled'}>
                    ${method.logo_url ? `<img class="pay-method-logo" src="${method.logo_url}" alt="">` : ''}
                    <span class="pay-method-name">${method.name}${method.enabled ? '' : ' скоро'}</span>
                </label>
            `).join('');
            methodsBox.querySelectorAll('input').forEach(input => input.addEventListener('change', syncSubmit));
        }

        function renderSummary() {
            const s = state.selectedStudent;
            if (!s) {
                summaryBox.style.display = 'none';
                summaryBox.innerHTML = '';
                return;
            }
            summaryBox.style.display = 'grid';
            summaryBox.innerHTML = `
                <div class="pay-summary-row"><span>Тариф</span><strong>${s.tariff.name}</strong></div>
                <div class="pay-summary-row"><span>К оплате</span><strong>${money(s.amount_due || s.tariff.price)}</strong></div>
            `;
        }

        async function loadOptions() {
            const response = await fetch('/api/pay/options');
            const data = await response.json();
            state.groups = data.groups || [];
            state.methods = data.methods || [];
            renderMethods();
            syncSubmit();
        }

        async function loadStudents(groupId) {
            state.selectedStudent = null;
            renderSummary();
            studentInput.disabled = true;
            studentInput.value = '';
            studentInput.placeholder = 'Загрузка...';
            studentList.innerHTML = '';
            const response = await fetch(`/api/pay/students?group_id=${encodeURIComponent(groupId)}`);
            const data = await response.json();
            state.students = data.students || [];
            studentInput.disabled = false;
            studentInput.placeholder = 'Введите ФИО ученика';
            syncSubmit();
        }

        groupInput.addEventListener('input', () => {
            const group = findByName(state.groups, groupInput.value, 'name');
            resetPaymentProgress();
            renderSummary();
            if (group) {
                selectGroup(group);
                groupList.classList.remove('open');
                return;
            } else {
                state.selectedGroup = null;
                state.selectedStudent = null;
                state.students = [];
                studentInput.disabled = true;
                studentInput.value = '';
                studentInput.placeholder = 'Сначала выберите группу';
                syncSubmit();
            }
            showGroupOptions();
        });

        studentInput.addEventListener('input', () => {
            const student = findByName(state.students, studentInput.value, 'full_name');
            resetPaymentProgress();
            if (student) {
                selectStudent(student);
                studentList.classList.remove('open');
                return;
            }
            state.selectedStudent = null;
            renderSummary();
            syncSubmit();
            showStudentOptions();
        });

        groupInput.addEventListener('focus', showGroupOptions);
        studentInput.addEventListener('focus', showStudentOptions);

        document.addEventListener('click', event => {
            if (!event.target.closest('.pay-combobox')) {
                groupList.classList.remove('open');
                studentList.classList.remove('open');
            }
        });

        consentInput.addEventListener('change', syncSubmit);

        document.getElementById('pay-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            resultBox.textContent = '';
            resultBox.classList.remove('error');
            providerBox.style.display = 'none';
            providerBox.innerHTML = '';
            const method = document.querySelector('input[name="pay_method"]:checked');
            const response = await fetch('/api/pay/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: state.selectedStudent?.id,
                    method: method?.value,
                    accepted_terms: consentInput.checked
                })
            });
            const data = await response.json();
            if (!data.success) {
                resultBox.textContent = data.message || 'Не удалось подготовить оплату';
                resultBox.classList.add('error');
                return;
            }
            const checkout = data.checkout;
            resultBox.textContent = data.message;
            providerBox.style.display = 'block';
            providerBox.innerHTML = `
                <strong>${checkout.method.name}: ${money(checkout.amount)}</strong>
                <div class="pay-note">После подключения API здесь будет переход на защищенную страницу платежной системы.</div>
                ${checkout.method.qr_url ? `<img src="${checkout.method.qr_url}" alt="${checkout.method.name} QR">` : ''}
            `;
        });

        loadOptions().catch(() => {
            resultBox.textContent = 'Не удалось загрузить данные для оплаты';
            resultBox.classList.add('error');
        });
    </script>
</body>

</html>
