<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - FK QORASUV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <video class="login-bg-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='uploads/background.mp4') }}" type="video/mp4">
    </video>
    <svg class="login-bg-filter" width="0" height="0" aria-hidden="true" focusable="false">
        <filter id="login-waves">
            <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="2">
                <animate attributeName="baseFrequency" dur="8s" values="0.006;0.012;0.006" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" scale="18">
                <animate attributeName="scale" dur="6s" values="12;24;12" repeatCount="indefinite" />
            </feDisplacementMap>
        </filter>
    </svg>
    <div class="login-container">
        <div class="login-box">
            <div class="login-brand">
                <img class="login-logo" src="{{ system_logo_url }}" alt="{{ system_name }}">
                <span>PRO APP</span>
            </div>
            <h2>Вход в систему</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="username" required>
                </div>
                
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="password-field">
                        <input type="password" id="password" required>
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Показать пароль">
                            <svg data-eye-icon xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg data-eye-off-icon xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                                <path d="m2 2 20 20" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Войти</button>
                <div id="error-message" class="error"></div>
            </form>
        </div>
    </div>

    <div class="login-ticker" aria-label="Контакты поддержки">
        <div class="login-ticker-track">
            <span id="login-ticker-text"></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/service-lock-overlay.js') }}"></script>
</body>
</html>
