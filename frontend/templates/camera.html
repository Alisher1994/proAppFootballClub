<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распознавание лиц</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body.theme-light .game-main-content {
            background: #f0f2f5;
        }

        /* Основной контейнер-сетка */
        .camera-dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            /* Видео занимает всё место, справа панель 380px */
            gap: 24px;
            padding: 24px;
            height: calc(100vh - 60px);
            /* Минус шапка если есть */
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Секция с видео */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-card {
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Заполнить карточку */
        }

        /* Контролы поверх видео */
        .video-controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .video-controls-overlay {
            opacity: 1;
        }

        .quality-group {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: #10b981;
            /* Зеленый */
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .action-btn {
            background: #ff8a00;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #ff8a00;
        }

        /* Карточка результата (снизу под видео) */
        .result-card {
            background: var(--theme-bg-secondary);
            border-radius: 20px;
            padding: 24px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--theme-border);
            display: flex;
            flex-direction: column;
        }

        .result-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--theme-text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Правая колонка (Список посещений) */
        .sidebar-section {
            background: var(--theme-bg-secondary);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--theme-border);
            height: 100%;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--theme-border);
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--theme-text-primary);
        }

        .counter-badge {
            background: #f7f4f1;
            color: #ff8a00;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        body.theme-dark .counter-badge {
            background: rgba(255, 138, 0, 0.2);
        }

        /* Список "Сегодня" */
        .visits-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .visit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            background: var(--theme-bg-primary);
            margin-bottom: 10px;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }

        .visit-item:hover {
            transform: translateX(4px);
            border-color: var(--theme-border);
        }

        .visit-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: #ddd;
        }

        .visit-info {
            flex: 1;
        }

        .visit-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--theme-text-primary);
            margin-bottom: 2px;
        }

        .visit-time {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        .visit-group {
            font-size: 12px;
            color: #64748b;
        }

        /* Скрытые элементы, необходимые для JS */
        #canvas {
            display: none;
        }

        /* Стили для блока результата (старый ID recognitionResult) */
        #recognitionResult {
            height: 100%;
        }

        /* Стили для контента внутри #studentInfo (генерируется JS) */
        #studentInfo {
            display: flex;
            gap: 24px;
            height: 100%;
            align-items: center;
        }

        #studentPhoto {
            width: 140px;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .student-data {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        #studentName {
            font-size: 28px;
            margin: 0;
            color: var(--theme-text-primary);
        }

        .balance-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            background: #10b981;
            color: white;
        }

        #checkinBtn {
            margin-top: 10px;
            background: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: fit-content;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #checkinBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
        }

        /* Скроллбар */
        .visits-list::-webkit-scrollbar {
            width: 6px;
        }

        .visits-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .visits-list::-webkit-scrollbar-thumb {
            background: #d8d0c8;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    {% include '_sidebar.html' %}

    <div class="main-content game-main-content">
        <div class="camera-dashboard">

            <!-- ЛЕВАЯ ЧАСТЬ: ВИДЕО + РЕЗУЛЬТАТ -->
            <div class="video-section">
                <!-- Карточка видео -->
                <div class="video-card">
                    <img id="cameraFeed" src="{{ url_for('video_feed') }}" alt="Camera Stream">
                    <canvas id="canvas"></canvas>

                    <!-- Контролы на видео -->
                    <div class="video-controls-overlay">
                        <div class="quality-group">
                            <span
                                style="color: rgba(255,255,255,0.6); font-size: 11px; align-self: center; margin-right: 8px;">ИСТОЧНИК:</span>
                            <button onclick="setCameraSource('ezviz', this)" class="control-btn" id="sourceEzviz">📡
                                Ezviz</button>
                            <button onclick="setCameraSource('webcam', this)" class="control-btn" id="sourceWebcam">💻
                                Веб-камера</button>
                        </div>

                        <div class="quality-group">
                            <span
                                style="color: rgba(255,255,255,0.6); font-size: 11px; align-self: center; margin-right: 8px;">КАЧЕСТВО:</span>
                            <button onclick="setCameraQuality('720p', 50, this)" class="control-btn" data-res="720p">⚡
                                720p</button>
                            <button onclick="setCameraQuality('1080p', 70, this)" class="control-btn"
                                data-res="1080p">⚖️ 1080p</button>
                            <button onclick="setCameraQuality('2k', 80, this)" class="control-btn" data-res="2k">💎
                                2K</button>
                        </div>

                        <div>
                            <button id="startCamera" class="action-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                </svg>
                                <span>ЗАПУСТИТЬ</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка результата распознавания -->
            <div class="result-card">
                <div class="result-header">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21"
                            stroke="#ff8a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M12 11C14.2091 11 16 9.20914 16 7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7C8 9.20914 9.79086 11 12 11Z"
                            stroke="#ff8a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Результат сканирования
                </div>

                <!-- Сюда JS вставляет результат -->
                <div id="recognitionResult">
                    <div
                        style="height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; flex-direction: column; gap: 10px;">
                        <div style="font-size: 40px; opacity: 0.3;">📷</div>
                        <p>Ожидание лица...</p>
                    </div>
                </div>

                <!-- Скрытый шаблон (используется существующим JS) -->
                <div id="studentInfo" style="display:none;">
                    <img id="studentPhoto" src="" alt="Фото">
                    <div class="student-data">
                        <h2 id="studentName">Имя Ученика</h2>
                        <p style="color: #64748b; margin: 0;">Баланс: <span id="studentBalance"
                                class="balance-badge">0</span> занятий</p>
                        <button id="checkinBtn">✓ Отметить посещение</button>
                    </div>
                </div>
                <div id="lowBalanceAlert" style="display:none;"></div>
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ: СПИСОК -->
        <div class="sidebar-section">
            <div class="sidebar-header" style="margin-bottom: 5px;">
                <div class="sidebar-title">Сегодня</div>
                <div class="counter-badge" id="todayCounter">0</div>
            </div>

            <div class="visits-list" style="margin-bottom: 15px;">
                <div id="todayList">
                    <div style="padding: 20px; text-align: center; color: #94a3b8;">Список пуст</div>
                </div>
            </div>

            <!-- МОНИТОР СИСТЕМЫ (Task Manager) -->
            <div style="margin-top: auto; padding-top: 15px; border-top: 2px dashed var(--theme-border);">
                <div
                    style="font-size: 14px; font-weight: 800; color: #ff8a00; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    Performance Monitor
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <!-- CPU -->
                    <div
                        style="background: var(--theme-bg-primary); padding: 10px; border-radius: 12px; border: 1px solid var(--theme-border);">
                        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">CPU Load</div>
                        <div style="font-size: 16px; font-weight: 700; color: var(--theme-text-primary);" id="statCPU">
                            0%</div>
                        <div style="height: 3px; background: #e4ddd6; border-radius: 2px; margin-top: 6px;">
                            <div id="barCPU"
                                style="height: 100%; background: #ff8a00; width: 0%; border-radius: 2px; transition: width 0.3s;">
                            </div>
                        </div>
                    </div>
                    <!-- RAM -->
                    <div
                        style="background: var(--theme-bg-primary); padding: 10px; border-radius: 12px; border: 1px solid var(--theme-border);">
                        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">RAM Usage</div>
                        <div style="font-size: 16px; font-weight: 700; color: var(--theme-text-primary);" id="statRAM">
                            0%</div>
                        <div style="height: 3px; background: #e4ddd6; border-radius: 2px; margin-top: 6px;">
                            <div id="barRAM"
                                style="height: 100%; background: #ff8a00; width: 0%; border-radius: 2px; transition: width 0.3s;">
                            </div>
                        </div>
                    </div>
                    <!-- GPU -->
                    <div
                        style="background: var(--theme-bg-primary); padding: 10px; border-radius: 12px; border: 1px solid var(--theme-border); grid-column: span 2;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-size: 11px; color: #94a3b8;" id="gpuName">GPU: N/A</div>
                            <div style="font-size: 11px; color: #ef4444; font-weight: 700;" id="statGPUTemp">0°C</div>
                        </div>
                        <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 4px;">
                            <div style="font-size: 16px; font-weight: 700; color: #10b981;" id="statGPU">0%</div>
                            <div style="font-size: 12px; color: #64748b;">(VRAM: <span id="statVRAM">0%</span>)</div>
                        </div>
                        <div
                            style="height: 3px; background: #e4ddd6; border-radius: 2px; margin-top: 8px; position: relative;">
                            <div id="barGPU"
                                style="height: 100%; background: #10b981; width: 0%; border-radius: 2px; transition: width 0.3s;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    </div>

    <script>
        // Загрузка текущих настроек при старте
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/camera/settings');
                const data = await response.json();
                if (data.success && data.settings) {
                    const currentRes = data.settings.resolution;
                    const currentSource = data.settings.source;

                    // Качество
                    document.querySelectorAll('.control-btn[data-res]').forEach(b => b.classList.remove('active'));
                    const activeResBtn = document.querySelector(`.control-btn[data-res="${currentRes}"]`);
                    if (activeResBtn) activeResBtn.classList.add('active');

                    // Источник
                    if (currentSource === 'webcam') {
                        document.getElementById('sourceWebcam').classList.add('active');
                        document.getElementById('sourceEzviz').classList.remove('active');
                    } else {
                        document.getElementById('sourceEzviz').classList.add('active');
                        document.getElementById('sourceWebcam').classList.remove('active');
                    }
                }
            } catch (e) {
                console.error('Ошибка загрузки настроек камеры:', e);
            }
        });

        async function setCameraSource(source, btn) {
            // Визуальное переключение
            document.getElementById('sourceEzviz').classList.remove('active');
            document.getElementById('sourceWebcam').classList.remove('active');
            if (btn) btn.classList.add('active');

            try {
                await fetch('/api/camera/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source })
                });
                console.log(`Источник изменен на ${source}`);
                // Перезагружаем изображение, чтобы сбросить поток
                const img = document.getElementById('cameraFeed');
                const currentSrc = img.src.split('?')[0];
                img.src = currentSrc + '?t=' + new Date().getTime();
            } catch (e) {
                console.error('Ошибка смены источника:', e);
            }
        }

        async function setCameraQuality(resolution, quality, btn) {
            // Визуальное переключение
            document.querySelectorAll('.control-btn[data-res]').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            try {
                const response = await fetch('/api/camera/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resolution, quality })
                });
                const data = await response.json();
                if (data.success) {
                    console.log(`Качество изменено на ${resolution}`);
                }
            } catch (e) {
                console.error('Ошибка смены качества:', e);
            }
        }
    </script>

    <!-- Подключаем существующие скрипты -->
    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>

</html>
